<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0E0E10" />
    <title>FihiranaVIF</title>
    <script>
      // Applique le thème avant le boot React (évite le FOUC).
      // Doit rester aligné avec src/lib/ui/theme.ts.
      (function () {
        try {
          var stored = localStorage.getItem("fihirana:ui-theme");
          var mode = stored || "system";
          var dark = mode === "dark" || (mode === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {
          /* localStorage indispo : on garde le thème clair */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
